<!DOCTYPE html>
<html lang="en"><head><title></title><script>
/**
 * BotGuard client for generating poTokens.
 * Updated to fix JavaScript 'this' binding issues and match BgUtils v3.2.0 patterns.
 */

// Global state for BotGuard
var bgVmFunctions = null;
var bgVm = null;
var bgProgram = null;
var poTokenMinter = null;  // Minter callback - created ONCE during init, reused for all tokens

// n-parameter decode support
var _nDecFn = null;
function setupNDecode(fnCode) {
    try { eval('_nDecFn = ' + fnCode); return true; } catch(e) { console.warn('[setupNDecode] ' + e); return false; }
}
function decodeN(n) {
    try {
        if (!_nDecFn) return null;
        var r = (_nDecFn instanceof Array) ? _nDecFn[0](n) : _nDecFn(n);
        return r || null;
    } catch(e) { console.warn('[decodeN] ' + e); return null; }
}

// Signature cipher decode support (for WEB/WEB_REMIX adaptive format URLs).
// decodeSig_global is set by setupSigDecode once player JS is injected.
var decodeSig_global = null;
function setupSigDecode(code) {
    try {
        // Wrap in IIFE so helper-object names don't leak into the global scope
        eval('(function(){' + code + '})()');
        return typeof decodeSig_global === 'function';
    } catch(e) { console.warn('[setupSigDecode] ' + e); return false; }
}
function decodeSig(sig) {
    try { return decodeSig_global ? decodeSig_global(sig) : null; }
    catch(e) { console.warn('[decodeSig] ' + e); return null; }
}

// Make WebView appear as Chrome to BotGuard environment checks.
if (!window.chrome) {
  window.chrome = {
    runtime: {},
    loadTimes: function() { return {}; },
    csi: function() { return {}; },
    app: {}
  };
}
try {
  Object.defineProperty(navigator, 'plugins', {
    get: function() {
      var p = [{name:'Chrome PDF Plugin',filename:'internal-pdf-viewer',description:'Portable Document Format'},
               {name:'Chrome PDF Viewer',filename:'mhjfbmdgcfjbbpaeojofohoefgiehjai',description:''},
               {name:'Native Client',filename:'internal-nacl-plugin',description:'Native Client'}];
      p.item = function(i){return this[i]||null;}; p.namedItem = function(n){return null;}; p.refresh = function(){};
      return p;
    }, configurable: true
  });
} catch(e) {}

function loadBotGuard(challengeData) {
  bgVm = window[challengeData.globalName];
  bgProgram = challengeData.program;
  bgVmFunctions = null;

  if (!bgVm)
    throw new Error('[BotGuardClient]: VM not found in the global object');

  if (!bgVm.a)
    throw new Error('[BotGuardClient]: Could not load program');

  // Use explicit variable capture instead of 'this' to avoid binding issues
  var vmFunctionsCallback = function(asyncSnapshotFunction, shutdownFunction, passEventFunction, checkCameraFunction) {
    bgVmFunctions = {
      asyncSnapshotFunction: asyncSnapshotFunction,
      shutdownFunction: shutdownFunction,
      passEventFunction: passEventFunction,
      checkCameraFunction: checkCameraFunction
    };
  };

  try {
    bgVm.a(bgProgram, vmFunctionsCallback, true, undefined, function() {}, [[], []]);
  } catch(e) {
    throw new Error('[BotGuardClient]: Failed to execute program: ' + e.message);
  }

  return new Promise(function(resolve, reject) {
    var attempts = 0;
    var maxAttempts = 10000;
    var checkInterval = setInterval(function() {
      if (bgVmFunctions && bgVmFunctions.asyncSnapshotFunction) {
        clearInterval(checkInterval);
        resolve({ vmFunctions: bgVmFunctions, vm: bgVm, program: bgProgram });
      } else if (attempts >= maxAttempts) {
        clearInterval(checkInterval);
        reject(new Error('[BotGuardClient]: Timeout waiting for asyncSnapshotFunction'));
      }
      attempts++;
    }, 1);
  });
}

function snapshot(botguard, args) {
  return new Promise(function(resolve, reject) {
    if (!botguard.vmFunctions || !botguard.vmFunctions.asyncSnapshotFunction) {
      return reject(new Error('[BotGuardClient]: Async snapshot function not found'));
    }
    try {
      botguard.vmFunctions.asyncSnapshotFunction(
        function(response) { resolve(response); },
        [args.contentBinding, args.signedTimestamp, args.webPoSignalOutput, args.skipPrivacyBuffer]
      );
    } catch(e) {
      reject(new Error('[BotGuardClient]: Snapshot failed: ' + e.message));
    }
  });
}

function runBotGuard(challengeData) {
  var interpreterJavascript = challengeData.interpreterJavascript.privateDoNotAccessOrElseSafeScriptWrappedValue;
  if (interpreterJavascript) {
    new Function(interpreterJavascript)();
  } else {
    throw new Error('[BotGuardClient]: Could not load VM - no interpreter JavaScript');
  }
  var webPoSignalOutput = [];
  return loadBotGuard({ globalName: challengeData.globalName, program: challengeData.program })
    .then(function(botguard) { return snapshot(botguard, { webPoSignalOutput: webPoSignalOutput }); })
    .then(function(botguardResponse) { return { webPoSignalOutput: webPoSignalOutput, botguardResponse: botguardResponse }; });
}

/**
 * Creates the poToken minter callback. Called ONCE during initialization.
 * The minter is stored globally and reused for all subsequent token requests.
 */
async function createPoTokenMinter(webPoSignalOutput, integrityToken) {
  var getMinter = webPoSignalOutput[0];

  if (!getMinter) {
    throw new Error('PMD:Undefined - webPoSignalOutput[0] is not defined');
  }
  if (typeof getMinter !== 'function') {
    throw new Error('PMD:NotFunction - webPoSignalOutput[0] is not a function, got: ' + typeof getMinter);
  }

  var mintCallback;
  try {
    var minterResult = getMinter(integrityToken);
    if (minterResult && typeof minterResult.then === 'function') {
      mintCallback = await minterResult;
    } else {
      mintCallback = minterResult;
    }
  } catch(e) {
    throw new Error('GMC:Failed - getMinter() threw: ' + e.message);
  }

  if (!mintCallback) {
    throw new Error('APF:Undefined - mintCallback is undefined');
  }
  if (typeof mintCallback !== 'function') {
    throw new Error('APF:NotFunction - mintCallback is not a function, got: ' + typeof mintCallback);
  }

  poTokenMinter = mintCallback;
}

/**
 * Mints a poToken using the pre-created minter. Must call createPoTokenMinter() first.
 */
async function obtainPoToken(identifier) {
  if (!poTokenMinter) {
    throw new Error('MNT:NotInit - poTokenMinter was not initialized');
  }

  var result;
  try {
    var mintResult = poTokenMinter(identifier);
    if (mintResult && typeof mintResult.then === 'function') {
      result = await mintResult;
    } else {
      result = mintResult;
    }
  } catch(e) {
    throw new Error('MNT:Failed - mintCallback() threw: ' + e.message);
  }

  if (!result) {
    throw new Error('YNJ:Undefined - mint result is undefined');
  }
  if (!(result instanceof Uint8Array)) {
    throw new Error('ODM:Invalid - result is not Uint8Array, got: ' + Object.prototype.toString.call(result));
  }
  if (result.length < 100 || result.length > 140) {
    console.warn('[obtainPoToken] Token size ' + result.length + ' bytes outside expected range (100-140)');
  }

  return result;
}
</script></head><body></body></html>
